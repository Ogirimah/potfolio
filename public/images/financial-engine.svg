<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061330"/>
      <stop offset="0.55" stop-color="#0a2a52"/>
      <stop offset="1" stop-color="#0b3f63"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <circle cx="120" cy="90" r="160" fill="url(#glow1)"/>
  <circle cx="500" cy="320" r="150" fill="url(#glow2)"/>

  <!-- document cards -->
  <g opacity="0.9">
    <rect x="70" y="118" width="118" height="150" rx="10" fill="#0e2f4d" stroke="#38bdf8" stroke-opacity="0.35"/>
    <rect x="86" y="138" width="62" height="7" rx="3.5" fill="#7dd3fc" opacity="0.8"/>
    <rect x="86" y="154" width="86" height="5" rx="2.5" fill="#7dd3fc" opacity="0.35"/>
    <rect x="86" y="167" width="74" height="5" rx="2.5" fill="#7dd3fc" opacity="0.3"/>
    <rect x="86" y="180" width="82" height="5" rx="2.5" fill="#7dd3fc" opacity="0.3"/>
    <rect x="86" y="200" width="42" height="16" rx="8" fill="#34d399" opacity="0.8"/>
    <rect x="86" y="228" width="88" height="5" rx="2.5" fill="#7dd3fc" opacity="0.25"/>
    <rect x="86" y="241" width="66" height="5" rx="2.5" fill="#7dd3fc" opacity="0.25"/>
  </g>

  <!-- chart panel -->
  <rect x="230" y="86" width="300" height="228" rx="14" fill="#081c36" stroke="#38bdf8" stroke-opacity="0.4"/>
  <g stroke="#1e4a73" stroke-width="1" opacity="0.7">
    <path d="M254 140H506M254 184H506M254 228H506M254 272H506"/>
  </g>

  <path d="M254 264 L291 245 L328 256 L365 214 L402 224 L439 182 L476 160 L506 128 L506 288 L254 288 Z" fill="url(#area)"/>
  <path d="M254 264 L291 245 L328 256 L365 214 L402 224 L439 182 L476 160 L506 128" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#d9f9ff">
    <circle cx="291" cy="245" r="4"/>
    <circle cx="365" cy="214" r="4"/>
    <circle cx="439" cy="182" r="4"/>
    <circle cx="506" cy="128" r="5" fill="#34d399"/>
  </g>

  <!-- bars -->
  <g fill="#38bdf8" opacity="0.45">
    <rect x="258" y="246" width="14" height="34" rx="3"/>
    <rect x="318" y="258" width="14" height="22" rx="3"/>
    <rect x="378" y="238" width="14" height="42" rx="3"/>
    <rect x="438" y="226" width="14" height="54" rx="3"/>
  </g>

  <!-- AI badge -->
  <g transform="translate(470 54)">
    <circle r="34" fill="#0a2a52" stroke="#22d3ee" stroke-opacity="0.6"/>
    <circle r="44" fill="none" stroke="#22d3ee" stroke-opacity="0.18"/>
    <text y="6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a5f3fc" letter-spacing="1">AI</text>
  </g>

  <text x="42" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" opacity="0.85" letter-spacing="3">FINANCIAL DECISION INTELLIGENCE</text>
</svg>
